name: CI e SonarCloud

on:
  pull_request:
    branches: [develop, feat/rf11-notificacoes, test/qualidade-final]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Java 21 / Testcontainers / JaCoCo / SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (historico para Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Validar estrutura dos planos JMeter e scripts de evidencia
        run: |
          python3 -m py_compile docs/qualidade/jmeter/analisar_jtl.py docs/qualidade/jmeter/rodar_local.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          planos = sorted(Path("docs/qualidade/jmeter").glob("*.jmx"))
          assert len(planos) == 4, f"Esperados 4 planos, encontrados {len(planos)}"
          for plano in planos:
              ET.parse(plano)
              print(f"JMeter XML valido: {plano.name}")
          PY

      - name: Executar unitarios, integracao MySQL e quality gates
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Publicar logs, testes, XML JaCoCo e HTML JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/jacoco.exec

      - name: Verificar disponibilidade do SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### SonarCloud: PENDENTE" >> "$GITHUB_STEP_SUMMARY"
            echo "Sem acesso de admin da organizacao para importar o projeto ou cadastrar token e chaves. A CI Maven/JaCoCo e obrigatoria e foi executada; o Quality Gate Sonar NAO foi verificado." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SonarCloud aguardando autorizacao do administrador; Quality Gate nao executado."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analisar SonarCloud e aguardar Quality Gate
        if: steps.sonar.outputs.enabled == 'true'
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn -B --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

  performance:
    name: JMeter / banco isolado / métricas reais
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout do PR
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Instalar Apache JMeter 5.6.3 (distribuicao oficial)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 240 \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz \
            --output "$RUNNER_TEMP/apache-jmeter-5.6.3.tgz"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512 \
            --output "$RUNNER_TEMP/apache-jmeter-5.6.3.tgz.sha512"
          (cd "$RUNNER_TEMP" && sha512sum --check apache-jmeter-5.6.3.tgz.sha512)
          tar -xzf "$RUNNER_TEMP/apache-jmeter-5.6.3.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Executar carga local isolada com MySQL 8.4
        run: python3 docs/qualidade/jmeter/rodar_local.py

      - name: Preservar JTL, dashboards HTML e invariantes SQL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-evidence
          if-no-files-found: warn
          path: quality-output/jmeter/
