name: CI e SonarCloud

on:
  pull_request:
    branches: [develop, feat/rf11-notificacoes]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Java 21 / Testcontainers / JaCoCo / SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (historico para Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Executar unitarios, integracao MySQL e quality gates
        working-directory: backend
        run: mvn -B --no-transfer-progress clean verify

      - name: Publicar logs, testes, XML JaCoCo e HTML JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/jacoco.exec

      - name: Verificar disponibilidade do SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_ORGANIZATION" || -z "$SONAR_PROJECT_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### SonarCloud: PENDENTE" >> "$GITHUB_STEP_SUMMARY"
            echo "Sem acesso de admin da organizacao para importar o projeto ou cadastrar token e chaves. A CI Maven/JaCoCo e obrigatoria e foi executada; o Quality Gate Sonar NAO foi verificado." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::SonarCloud aguardando autorizacao do administrador; Quality Gate nao executado."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Analisar SonarCloud e aguardar Quality Gate
        if: steps.sonar.outputs.enabled == 'true'
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          mvn -B --no-transfer-progress org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true
